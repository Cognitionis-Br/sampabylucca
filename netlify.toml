[build]
  command   = "npm run build"
  publish   = "dist"

# SPA routing — todas as rotas caem no index.html
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# Admin SPA separada
[[redirects]]
  from   = "/admin/*"
  to     = "/admin/index.html"
  status = 200

[build.environment]
  NODE_VERSION = "20"

# Headers de segurança
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"
